name: sabnzbd
title: SABnzbd
summary: SABnzbd - The automated Usenet download tool
description: The automated Usenet download tool
license: GPL-2.0-or-later
website: https://sabnzbd.org
contact: https://github.com/sabnzbd/sabnzbd/issues
confinement: strict
base: core24
grade: stable
icon: interfaces/Config/templates/staticcfg/images/logo-small.svg
adopt-info: sabnzbd

# Declaring _daemon_ makes snapd extend the seccomp/AppArmor profiles to permit
# setuid/setgid/setgroups/chown *to this dedicated account only*, which is what
# lets the launcher drop the daemon out of root (see bin/drop-privs). _daemon_
# is the current name for what older snapd released as snap_daemon.
system-usernames:
  _daemon_: shared

platforms:
  amd64:
  arm64:

apps:
  sabnzbd:
    environment:
      LC_CTYPE: C.UTF-8
      SNAPCRAFT_PRELOAD_REDIRECT_ONLY_SHM: 1
    # drop-privs runs first (as root), prepares a _daemon_-owned data dir
    # ($SNAP_COMMON/data), then re-execs the command below as _daemon_.
    command-chain: [bin/drop-privs]
    command: usr/bin/snapcraft-preload python3 $SNAP/opt/sabnzbd/SABnzbd.py -f $SNAP_COMMON/data
    daemon: simple
    stop-mode: sigterm-all
    stop-timeout: 20s
    restart-condition: on-failure
    restart-delay: 20s
    plugs: [network, home, network-bind, removable-media]

parts:
  sabnzbd:
    after: [snapcraft-preload]
    plugin: python
    source: .
    python-requirements:
      - requirements.txt
    stage-packages:
      - unrar
      - 7zip-standalone
      - util-linux
    build-packages:
      - git
      - pkg-config
      - libffi-dev
      - python3-dev
      - libssl-dev
      - cargo
      - rsync
    override-pull: |
      craftctl default
      craftctl set version=$(grep -o -P '(?<=__version__ = ").*(?=")' sabnzbd/version.py)
      if [ -z "$(git status --porcelain)" ]; then
        COMMIT=$(git rev-parse --short HEAD)
        sed -i "s/__baseline__ = .*/__baseline__ = \"${COMMIT}\"/" sabnzbd/version.py
      fi
    override-build: |
      # SABnzbd is an application source tree, not a pip-installable package.
      # The Python plugin runs `pip install -U .` when pyproject.toml exists,
      # so hide it during `craftctl default` and restore it immediately after.
      mv pyproject.toml pyproject.toml.snapcraft-backup
      craftctl default
      mv pyproject.toml.snapcraft-backup pyproject.toml
      python3 tools/make_mo.py
      rsync -av --mkpath \
        --exclude=.git \
        --exclude=.github \
        --exclude=builder \
        --exclude=macos \
        --exclude=po \
        --exclude=snap \
        --exclude=tests \
        --exclude=win \
        $CRAFT_PART_BUILD/ $CRAFT_PART_INSTALL/opt/sabnzbd/
      ln -sf ../usr/lib/libsnapcraft-preload.so $CRAFT_PART_INSTALL/lib/libsnapcraft-preload.so
      # 7-Zip script has an invalid path in a snap context
      rm -rf $CRAFT_PART_INSTALL/usr/bin/7zz
      # Launcher that drops the daemon from root to _daemon_ (see the script
      # for details). install sets the exec bit regardless of the source file's.
      install -Dm0755 $CRAFT_PROJECT_DIR/snap/local/drop-privs $CRAFT_PART_INSTALL/bin/drop-privs
    organize:
      usr/bin/unrar-nonfree: usr/bin/unrar
      usr/lib/7zip/7zz: usr/bin/7zz
    prime:
      - -usr/lib/7zip
  par2cmdline-turbo:
    source: .
    plugin: autotools
    build-packages:
      - jq
      - curl
    build-environment:
      - LDFLAGS: -s
    override-pull: |
      PAR2_TARBALL_PATH="$CRAFT_PROJECT_DIR/snap/par2cmdline.tar.gz"
      if [ ! -f "$PAR2_TARBALL_PATH" ]; then
        PAR2_TARBALL=$(curl -sL https://api.github.com/repos/animetosho/par2cmdline-turbo/releases/latest | jq -r '.tarball_url')
        curl -o "$PAR2_TARBALL_PATH" -L "$PAR2_TARBALL"
      else
        echo "Using cached snap/par2cmdline.tar.gz"
      fi
      tar xf "$PAR2_TARBALL_PATH" --strip-components=1
    autotools-configure-parameters:
      - --prefix=/usr
  snapcraft-preload:
    source: https://github.com/sergiusens/snapcraft-preload.git
    plugin: cmake
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DLIBPATH=/lib
    stage-packages:
      - to amd64:
        - lib32stdc++6
    build-packages:
      - to amd64:
        - gcc-multilib
        - g++-multilib
